    <text x="360" y="1102" fill="#8390a0" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">ILLUSTRATIVE FEATURE CONCEPT · NOT AN APP SCREENSHOT</text>
