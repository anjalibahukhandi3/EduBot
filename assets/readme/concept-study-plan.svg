    <text x="160" y="302" fill="#c8d7e7" font-family="Arial, sans-serif" font-size="17">One session at a time.</text>
    <text x="160" y="388" fill="#1f3550" font-family="Arial, sans-serif" font-size="24" font-weight="700">Your study plan</text>
    <text x="160" y="419" fill="#718198" font-family="Arial, sans-serif" font-size="16">Today · 3 focused sessions</text>
    <rect x="160" y="447" width="392" height="148" rx="24" fill="#fff" stroke="#e1e8f0" stroke-width="2"/>
    <circle cx="223" cy="521" r="36" fill="none" stroke="#e5edf8" stroke-width="9"/>
    <path d="M223 485a36 36 0 1 1-30 56" fill="none" stroke="#2e6de8" stroke-width="9" stroke-linecap="round"/>
    <text x="223" y="527" fill="#203d62" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">65%</text>
    <text x="278" y="505" fill="#243b56" font-family="Arial, sans-serif" font-size="19" font-weight="700">Steady progress</text>
    <text x="278" y="534" fill="#75849a" font-family="Arial, sans-serif" font-size="15">A little done is still done.</text>
    <rect x="278" y="552" width="220" height="8" rx="4" fill="#e7edf5"/>
    <rect x="278" y="552" width="143" height="8" rx="4" fill="url(#blue)"/>
    <text x="160" y="644" fill="#243b56" font-family="Arial, sans-serif" font-size="20" font-weight="700">Next up</text>
