<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1220" viewBox="0 0 720 1220" role="img" aria-labelledby="title desc">
  <title id="title">StudyMate AI study plan concept</title>
  <desc id="desc">Illustrative mobile study planner with a progress ring and three subject tasks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef4fb"/><stop offset="1" stop-color="#dce8f5"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183655"/><stop offset="1" stop-color="#234a73"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4385f4"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#17334f" flood-opacity=".18"/></filter>
  </defs>
  <rect width="720" height="1220" rx="54" fill="url(#bg)"/>
  <circle cx="620" cy="112" r="116" fill="#c8dcf2" opacity=".55"/>
  <circle cx="80" cy="1080" r="140" fill="#d3e4f4" opacity=".7"/>
  <text x="56" y="61" fill="#58708b" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">STUDY PLANNER  /  CONCEPT VISUAL</text>
  <g filter="url(#shadow)">
    <rect x="116" y="88" width="488" height="1056" rx="56" fill="#152941"/>
    <rect x="132" y="104" width="456" height="1024" rx="42" fill="#f8fafc"/>
    <path d="M132 146a42 42 0 0 1 42-42h372a42 42 0 0 1 42 42v196H132z" fill="url(#navy)"/>
    <rect x="160" y="139" width="36" height="36" rx="12" fill="#ffffff" opacity=".15"/>
    <path d="M169 147h18v20l-9-5-9 5z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
    <text x="208" y="164" fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="700">StudyMate AI</text>
    <text x="160" y="228" fill="#dce8f5" font-family="Arial, sans-serif" font-size="15" letter-spacing="1.6">FOCUS TODAY</text>
