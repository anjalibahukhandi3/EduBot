      <rect x="160" y="668" width="392" height="88" rx="19" fill="#fff" stroke="#e2e9f1" stroke-width="2"/>
      <circle cx="193" cy="712" r="14" fill="#e7efff"/><text x="193" y="718" fill="#2867df" font-size="16" font-weight="700" text-anchor="middle">1</text>
      <text x="221" y="706" fill="#263c56" font-size="17" font-weight="700">Calculus</text><text x="221" y="731" fill="#8290a2" font-size="14">35 min · Problem set</text>
      <rect x="160" y="772" width="392" height="88" rx="19" fill="#fff" stroke="#e2e9f1" stroke-width="2"/>
      <circle cx="193" cy="816" r="14" fill="#e7efff"/><text x="193" y="822" fill="#2867df" font-size="16" font-weight="700" text-anchor="middle">2</text>
      <text x="221" y="810" fill="#263c56" font-size="17" font-weight="700">Physics revision</text><text x="221" y="835" fill="#8290a2" font-size="14">25 min · Review notes</text>
      <rect x="160" y="876" width="392" height="88" rx="19" fill="#fff" stroke="#e2e9f1" stroke-width="2"/>
      <circle cx="193" cy="920" r="14" fill="#e7efff"/><text x="193" y="926" fill="#2867df" font-size="16" font-weight="700" text-anchor="middle">3</text>
      <text x="221" y="914" fill="#263c56" font-size="17" font-weight="700">Biology quiz</text><text x="221" y="939" fill="#8290a2" font-size="14">15 min · Quick recap</text>
    </g>
    <rect x="160" y="988" width="392" height="62" rx="20" fill="url(#blue)"/>
    <text x="356" y="1027" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Start focus session</text>
    <text x="360" y="1090" fill="#8390a0" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">ILLUSTRATIVE FEATURE CONCEPT · NOT AN APP SCREENSHOT</text>
